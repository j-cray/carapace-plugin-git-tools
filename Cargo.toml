[package]
name = "carapace-plugin-git-tools"
version = "0.1.0"
edition = "2021"
description = "Comprehensive Git tool suite for Carapace agents"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "carapace:plugin"
target = { path = "wit/plugin.wit", world = "tool-plugin" }

[dependencies]
wit-bindgen = { version = "0.36.0", default-features = false, features = ["realloc"] }
wit-bindgen-rt = "0.36.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
gix = { version = "0.87", default-features = false, features = ["sha1", "revision", "index", "status", "dirwalk", "blob-diff", "merge", "blame", "attributes", "excludes", "serde"] }
sha1 = "0.10"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.14"
