[package]
name = "git-tools"
version = "0.1.0"
edition = "2021"
description = "Comprehensive Git tool suite for Carapace agents"
license = "MIT OR Apache-2.0"

[lib]
name = "git_tools"
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "carapace:plugin"
target = { path = "wit/plugin.wit", world = "tool-plugin" }

[dependencies]
wit-bindgen = { version = "0.41", default-features = false, features = ["realloc"] }
wit-bindgen-rt = "0.44"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
sha1 = "0.10"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.14"
